task: taxowarn_s
seed: 0
tag: main_taxowarn_s
model:
  name: taxowarn_s
  d: 384
  enc_layers: 2
  dec_layers: 2
  dropout: 0.1
  use_queries: true
  use_spatial: true
  use_text: true
  use_hazard_layer: true
  hierarchical: true
  use_global_residual: true
  use_dual: true
data:
  version: v1
  split: split_v1
  labels: D:/highwaymm/HighwayMM_release/annotations/labels_v1.csv
  features: D:/highwaymm/HighwayMM_release/features/siglip2
  spatial: D:/highwaymm/HighwayMM_release/features/siglip2_spatial
  text_protos: D:/highwaymm/HighwayMM_release/features/text_protos_siglip2.npz
  use_raw: false
  k: 8
  sources_train: all
  min_w: 0.0
loss:
  warn: 0.0
  onset: 0.2
  hazard_reg: 0.01
  label_smoothing: 0.05
train:
  epochs: 30
  batch_size: 128
  eval_batch_size: 256
  accum_steps: 1
  lr: 3.0e-4
  weight_decay: 0.05
  warmup_frac: 0.05
  amp: bf16
  grad_clip: 1.0
  num_workers: 0
  log_every: 50
  eval_every: 1
  channels_last: false
  freeze: []
  resume: null

